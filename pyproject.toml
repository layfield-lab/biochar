[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biochar"
version = "0.7.0"
description = "Generate biochar molecular structures for GROMACS MD simulations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["biochar", "molecular-dynamics", "gromacs", "PAH", "force-field", "OPLS-AA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.1",
    # rdkit is listed here for PyPI; conda users should install via conda-forge
    "rdkit>=2023.9.1",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
    "pandas>=1.5.0",
]
ml = [
    "scikit-learn>=1.3",
]
# The 'qm' charge backend (LigParGen-style 1.14*CM1A) shells out to an external
# MOPAC binary, which is NOT installable from PyPI. Install MOPAC separately:
#   conda install -c conda-forge mopac
# or from https://github.com/openmopac/mopac. This extra carries no Python
# dependencies of its own; it exists as a discoverable marker so that
# `pip install biochar[qm]` succeeds and documents the requirement. The backend
# discovers `mopac` on PATH at run time (override with $MOPAC_CMD).
qm = []
dev = [
    "pytest>=7.0",
    "pytest-cov",
    # The suite is CPU-bound, has no shared fixtures or output paths, and runs
    # ~22 min single-process on a 14-core machine. xdist is the difference
    # between a suite people run and one they route around.
    #
    # Not optional: [tool.pytest.ini_options] addopts passes an xdist flag, so
    # pytest without this refuses to start rather than merely running serially.
    "pytest-xdist>=3.0",
    "ruff>=0.6",
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "myst-parser",
    "nbsphinx",
    "nbconvert",
]

[project.scripts]
biochar-gen = "biochar.cli.cli:main"
biochar-sweep = "biochar.cli.sweep_cli:main"
biochar-md-setup = "biochar.cli.md_setup_cli:main"
biochar-condense = "biochar.cli.condensation_cli:main"

[project.urls]
Homepage = "https://github.com/layfield-lab/biochar"
Repository = "https://github.com/layfield-lab/biochar"
"Bug Tracker" = "https://github.com/layfield-lab/biochar/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["biochar*"]

[tool.setuptools.package-data]
# py.typed marks the package as carrying inline type information (PEP 561);
# without it type checkers ignore the annotations entirely for consumers.
biochar = ["py.typed", "data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# xdist's default `--dist load` hands each worker a chunk up front, so the 15
# end-to-end regressions below -- ~43s each -- bunch onto a few workers and
# serialise there while the rest idle. The arithmetic gives it away: the fast
# tier alone is ~31s and the slow tier alone is ~49s, but the two together used
# to take 3m30s. `worksteal` lets an idle worker take work back off a busy one,
# which costs nothing and returns the full suite to roughly the length of its
# longest chain.
#
#   full suite, --dist load       3m30s
#   full suite, --dist worksteal  1m25s
#
# Inert without `-n`, so a serial run is unaffected -- but it is an xdist
# option, so pytest refuses to start at all if the plugin is missing. That is
# safe only because `pytest` and `pytest-xdist` ship in the same `[dev]` extra:
# anyone who can run the suite has both. Keep them together, or move this flag
# to the documented commands.
addopts = "--dist worksteal"

# Measured 2026-07-28: 12 tests consume ~943s of the suite's ~1350s -- 70% of
# total runtime, averaging ~79s each. They are the end-to-end regression tests
# that generate real temperature/feedstock structures across several seeds, some
# under strict mode where a failed seed retries up to 8 times.
#
# The split is per-class, not per-file, on purpose. Those same files hold 44
# unit tests that run in 1.15s against synthetic coordinates; a file-level split
# would exile real coverage of the H-bond floor, the severity tolerance, and
# bond-order scaling into a tier nobody runs before committing.
#
#   pytest -m "not slow"   fast tier -- what the pre-commit hook runs
#   pytest                 everything -- what CI runs
markers = [
    "slow: end-to-end regression that generates real structures (tens of seconds each)",
]

# NOTE ON --dist loadscope: measured and rejected, 2026-07-29.
#
# loadscope groups tests by class so a class-scoped fixture is built once rather
# than once per worker. That sounds strictly better and is not, because it also
# serialises a whole class onto a single worker.
#
#   slow tier, -n auto (14 cores):   loadscope 304s   vs   load 141s
#   slow tier, -n 2    (CI-like):    loadscope 170s   vs   load 183s
#
# A 7% gain at CI's worker count does not pay for a 2x loss on a developer
# machine. The shared fixture is kept regardless -- under the default scheduler
# it still avoids a rebuild whenever two tests of a class land on the same
# worker, and is merely neutral when they do not. Do not add loadscope back
# without re-measuring both columns.

[tool.coverage.run]
# The package name, not a path: under the src layout coverage should follow
# the *installed* package, which is what the tests import.
source = ["biochar"]
omit = ["tests/*", "examples/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Deliberately narrow to start. The codebase has never been linted, so enabling
# the full default set would produce hundreds of findings and the job would be
# switched off within a week. E (pycodestyle errors) and F (pyflakes) catch the
# things that are actually bugs -- undefined names, unused imports, redefined
# functions. Widen once this is green and stays green.
select = ["E", "F"]
ignore = [
    "E501",  # line length -- the formatter's job, not the linter's
    "E741",  # ambiguous variable names (l, I, O): O is an element symbol here
    # Module-level import not at top of file. This flags a deliberate,
    # documented convention: src/biochar/__init__.py registers a logging
    # NullHandler before its re-exports so the package never emits
    # "No handler found", and several modules bind `logger` before importing
    # from .constants. Satisfying E402 would mean reordering working code to
    # suit the linter.
    "E402",
]

[tool.ruff.lint.per-file-ignores]
# Star-imports and long setup blocks are idiomatic in test modules.
"tests/*" = ["F403", "F405"]
# __init__.py re-exports the public API; imported-but-unused is the point.
"src/biochar/__init__.py" = ["F401"]
